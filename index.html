<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Ayrton Daniel | Links</title>
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1322;
            --card-bg: #172033;
            --card-hover: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 440px;
        }

        /* Estilo do Header com a foto em retrato */
        .profile-header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .avatar-container {
            width: 100%;
            max-height: 220px; /* Altura ideal para foto em retrato */
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
        }

        .avatar {
            width: 100%;
            height: auto;
            max-height: 220px;
            object-fit: cover;
            object-position: center top; /* Garante que o rosto apareça bem enquadrado */
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 5px 0;
            font-weight: 600;
        }

        .crm {
            font-size: 0.8rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        p.bio {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
            line-height: 1.4;
        }

        /* Estilo dos Botões de Links */
        .link-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            color: var(--text-main);
            padding: 14px 20px;
            margin-bottom: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .link-button i {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .link-button span {
            flex-grow: 1;
            text-align: center;
        }

        .link-button:hover {
            background-color: var(--card-hover);
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
        }

        /* Destaque especial para o WhatsApp */
        .link-button.whatsapp {
            background: linear-gradient(135deg, #065f46 0%, #047857 100%);
            border-color: #059669;
        }
        .link-button.whatsapp i {
            color: #34d399;
        }
        .link-button.whatsapp:hover {
            background: linear-gradient(135deg, #047857 0%, #065f46 100%);
            border-color: #34d399;
        }

        /* Ícones Sociais Rodapé */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .social-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-main);
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
            transform: translateY(-3px);
        }

        footer {
            margin-top: 35px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header com Foto Retrato e Informações do Dr. -->
        <div class="profile-header">
            <div class="avatar-container">
                <img src="dr_ayrton.png" alt="Dr. Ayrton Daniel" class="avatar">
            </div>
            <h1>Dr. Ayrton Daniel</h1>
            <div class="crm">CRM-SP 123.456 • RQE 45.678</div>
            <p class="bio">Obstetrícia humanizada com evidências científicas e acolhimento integrativo.</p>
        </div>

        <!-- Links Principais -->
        <a href="https://drayrtondaniel.github.io/circulo-nascer/" class="link-button" target="_blank">
            <i class="fa-solid fa-circle-nodes"></i>
            <span>Círculo Nascer (Consultoria Obstétrica)</span>
            <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; opacity: 0.5;"></i>
        </a>

        <a href="https://drayrtondaniel.github.io/curso-para-gestantes/" class="link-button" target="_blank">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Curso para Gestantes</span>
            <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; opacity: 0.5;"></i>
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/5519991465431?text=Olá%20Dr.%20Ayrton,%20vim%20através%20do%20link%20na%20bio." class="link-button whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            <span>Fale Comigo no WhatsApp</span>
            <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; opacity: 0.5;"></i>
        </a>

        <!-- Redes Sociais -->
        <div class="social-icons">
            <a href="https://www.youtube.com/@DrAyrtonDaniel" class="social-icon-btn" target="_blank" title="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="https://www.tiktok.com/@dr.ayrtondaniel" class="social-icon-btn" target="_blank" title="TikTok">
                <i class="fa-brands fa-tiktok"></i>
            </a>
        </div>

        <footer>
            © 2026 Dr. Ayrton Daniel • Todos os direitos reservados
        </footer>
    </div>

</body>
</html>
