<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Ayrton Daniel | Links</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta baseada no Círculo Nascer */
            --bg-deep: #0a0f1a;
            --bg-gradient: radial-gradient(circle at 20% 20%, #15223b 0%, #0a0f1a 80%);
            --card-bg: rgba(21, 29, 48, 0.65);
            --card-border: rgba(56, 189, 248, 0.12);
            --card-hover-bg: rgba(28, 39, 64, 0.85);
            --card-hover-border: rgba(56, 189, 248, 0.3);
            --accent: #38bdf8;
            --accent-soft: #7dd3fc;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --whatsapp-bg: rgba(17, 42, 35, 0.8);
            --whatsapp-border: rgba(52, 211, 153, 0.25);
            --whatsapp-hover: rgba(22, 56, 47, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 28px 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
            animation: fadeUp 0.8s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Cartão de Perfil ---------- */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px 24px 24px;
            margin-bottom: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }

        /* Foto com moldura elegante */
        .avatar-frame {
            width: 100%;
            max-width: 220px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(125, 211, 252, 0.1));
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.15), 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: top center;
            display: block;
            border: 2px solid var(--bg-deep);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .crm {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--accent-soft);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 14px;
        }

        .bio {
            font-size: 0.9rem;
            font-weight: 300;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto;
        }

        /* ---------- Botões de Link ---------- */
        .links-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .link-button {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-align: left;
        }

        .link-button i.btn-icon {
            font-size: 1.25rem;
            color: var(--accent);
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }

        .link-button span {
            flex-grow: 1;
            line-height: 1.3;
        }

        .link-button .arrow-icon {
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.5;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .link-button:hover {
            background: var(--card-hover-bg);
            border-color: var(--card-hover-border);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .link-button:hover .arrow-icon {
            transform: translateX(4px);
            opacity: 0.9;
        }

        /* WhatsApp com cor suave */
        .link-button.whatsapp {
            background: var(--whatsapp-bg);
            border-color: var(--whatsapp-border);
        }
        .link-button.whatsapp i.btn-icon {
            color: #34d399;
        }
        .link-button.whatsapp:hover {
            background: var(--whatsapp-hover);
            border-color: rgba(52, 211, 153, 0.45);
        }

        /* ---------- Redes Sociais ---------- */
        .social-section {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            color: var(--text-secondary);
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .social-btn:hover {
            background: var(--card-hover-bg);
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.15);
        }

        /* ---------- Rodapé ---------- */
        footer {
            font-size: 0.7rem;
            color: #64748b;
            letter-spacing: 0.03em;
            font-weight: 400;
        }

        /* Responsividade para telas menores */
        @media (max-width: 380px) {
            .profile-card { padding: 20px 16px; }
            .link-button { padding: 14px 16px; font-size: 0.9rem; }
            .social-btn { width: 44px; height: 44px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Cartão de Perfil -->
        <div class="profile-card">
            <div class="avatar-frame">
                <img src="./dr_ayrton.png" alt="Dr. Ayrton Daniel" class="avatar">
            </div>
            <h1>Dr. Ayrton Daniel</h1>
            <div class="crm">CRM-SP 123.456 • RQE 45.678</div>
            <p class="bio">Obstetrícia humanizada com evidências científicas e acolhimento integrativo.</p>
        </div>

        <!-- Links Principais -->
        <div class="links-section">
            <a href="https://drayrtondaniel.github.io/circulo-nascer/" class="link-button" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-circle-nodes btn-icon"></i>
                <span>Círculo Nascer (Consultoria Obstétrica)</span>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://drayrtondaniel.github.io/curso-para-gestantes/" class="link-button" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-graduation-cap btn-icon"></i>
                <span>Curso para Gestantes</span>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://wa.me/5519991465431?text=Olá%20Dr.%20Ayrton,%20vim%20através%20do%20link%20na%20bio." class="link-button whatsapp" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-whatsapp btn-icon"></i>
                <span>Fale Comigo no WhatsApp</span>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
        </div>

        <!-- Redes Sociais -->
        <div class="social-section">
            <a href="https://www.youtube.com/@DrAyrtonDaniel" class="social-btn" target="_blank" rel="noopener noreferrer" title="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="https://www.tiktok.com/@dr.ayrtondaniel" class="social-btn" target="_blank" rel="noopener noreferrer" title="TikTok">
                <i class="fa-brands fa-tiktok"></i>
            </a>
        </div>

        <footer>
            © 2026 Dr. Ayrton Daniel • Todos os direitos reservados
        </footer>
    </div>

</body>
</html>
